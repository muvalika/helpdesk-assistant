<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Service Portal | AI Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --sidebar-width: 280px; --primary-dark: #00274d; }
        body { background-color: #f4f7f9; height: 100vh; overflow: hidden; display: flex; }
        
        /* Component: Sidebar Ticket History */
        #sidebar { width: var(--sidebar-width); background: var(--primary-dark); color: white; display: flex; flex-direction: column; }
        .ticket-item { padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; }
        .ticket-item:hover { background: rgba(255,255,255,0.05); }

        /* Component: Main Content Area */
        #main-content { flex: 1; display: flex; flex-direction: column; }
        
        /* Component: Dynamic Status Bar */
        .status-bar { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .status-indicator { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .dot { height: 10px; width: 10px; background-color: #28a745; border-radius: 50%; display: inline-block; }

        /* Component: Chat Interface */
        #chat-container { flex: 1; display: flex; flex-direction: column; max-width: 900px; margin: 20px auto; width: 95%; background: white; border-radius: 12px; shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Component: Quick Action Tiles */
        .quick-actions { display: flex; gap: 10px; padding: 15px; background: #f8f9fa; border-top: 1px solid #eee; }
        .action-btn { flex: 1; font-size: 0.8rem; }
    </style>
</head>
<body>

    <nav id="sidebar" class="d-none d-md-flex">
        <div class="p-4 border-bottom border-secondary text-center">
            <h6><i class="bi bi-cpu-fill me-2"></i>IT Help Desk</h6>
        </div>
        <div class="p-3"><small class="text-secondary uppercase">Recent Tickets</small></div>
        <div class="ticket-history">
            <div class="ticket-item"><small>#TK-8821: VPN Access</small><br><span class="badge bg-success">Resolved</span></div>
            <div class="ticket-item"><small>#TK-8904: Laptop Boot</small><br><span class="badge bg-warning">Pending</span></div>
        </div>
    </nav>

    <main id="main-content">
        <header class="status-bar">
            <div class="status-indicator">
                <span class="dot"></span> System Status: <strong>All Services Operational</strong>
            </div>
            <div>
                <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-person-circle"></i> User: muvalika</button>
            </div>
        </header>

        <div id="chat-container" class="shadow-sm">
            <div id="messages">
                <div class="alert alert-info py-2" style="font-size: 0.8rem;">
                    <i class="bi bi-info-circle-fill me-2"></i> Real-time session started. How can I assist with your IT needs?
                </div>
            </div>

            <div class="quick-actions">
                <button class="btn btn-light border btn-sm action-btn" onclick="UI.quickSend('Reset my password')"><i class="bi bi-key"></i> Reset Password</button>
                <button class="btn btn-light border btn-sm action-btn" onclick="UI.quickSend('WiFi is slow')"><i class="bi bi-wifi"></i> WiFi Issue</button>
                <button class="btn btn-light border btn-sm action-btn" onclick="UI.quickSend('Request software')"><i class="bi bi-box-seam"></i> Software</button>
            </div>

            <div class="p-3 border-top">
                <div class="input-group">
                    <input type="text" id="userInput" class="form-control" placeholder="Type your issue (e.g., VPN not connecting)...">
                    <button class="btn btn-primary" onclick="UI.handleSend()">Send</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const UI = (() => {
            const msgBox = document.getElementById('messages');
            const input = document.getElementById('userInput');

            return {
                append: (text, side) => {
                    const div = document.createElement('div');
                    div.className = `p-3 rounded-3 mb-2 ${side === 'user' ? 'bg-primary text-white ms-auto w-75' : 'bg-light w-75'}`;
                    div.innerHTML = text;
                    msgBox.appendChild(div);
                    msgBox.scrollTop = msgBox.scrollHeight;
                },
                quickSend: (text) => {
                    input.value = text;
                    UI.handleSend();
                },
                handleSend: async () => {
                    const val = input.value;
                    if(!val) return;
                    UI.append(val, 'user');
                    input.value = '';
                    
                    // Simulate API Call to Rasa/MCP
                    try {
                        const response = await fetch("http://localhost:5005/webhooks/rest/webhook", {
                            method: "POST",
                            body: JSON.stringify({ sender: "user_1", message: val })
                        });
                        const data = await response.json();
                        data.forEach(m => UI.append(m.text, 'bot'));
                    } catch (e) {
                        UI.append("System is offline. Ensure Rasa is running.", 'bot');
                    }
                }
            };
        })();

        document.getElementById('userInput').addEventListener('keypress', e => e.key === 'Enter' && UI.handleSend());
    </script>
</body>
</html>
