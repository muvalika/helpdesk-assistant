<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Help Desk | Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --navy: #00274d; --electric: #007bff; --bg: #f4f7f9; }
        body { background: var(--bg); height: 100vh; display: flex; font-family: 'Inter', sans-serif; }
        
        /* Component: Sidebar (Ticket Navigation) */
        #sidebar { width: 280px; background: var(--navy); color: white; display: flex; flex-direction: column; }
        .ticket-card { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s; }
        .ticket-card:hover { background: rgba(255,255,255,0.05); }

        /* Component: Main Chat Workspace */
        #workspace { flex: 1; display: flex; flex-direction: column; }
        .top-nav { background: white; padding: 12px 25px; border-bottom: 1px solid #e0e6ed; display: flex; justify-content: space-between; }
        
        #chat-interface { flex: 1; max-width: 900px; margin: 20px auto; width: 95%; background: white; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        #message-flow { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Message Styling */
        .bubble { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; position: relative; }
        .bot { background: #f0f2f5; align-self: flex-start; color: #1c1e21; border-bottom-left-radius: 4px; }
        .user { background: var(--electric); align-self: flex-end; color: white; border-bottom-right-radius: 4px; }

        /* Dynamic Component: Action Tiles */
        .action-bar { padding: 15px; background: #fafbfc; border-top: 1px solid #eee; display: flex; gap: 10px; overflow-x: auto; }
        .tile { white-space: nowrap; border-radius: 20px; font-weight: 500; font-size: 0.85rem; }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div class="p-4 border-bottom border-secondary">
            <h5 class="mb-0"><i class="bi bi-cpu-fill me-2 text-info"></i>IT Assistant</h5>
        </div>
        <div class="p-3"><small class="text-uppercase text-secondary fw-bold" style="font-size: 0.7rem;">Live Ticket Status</small></div>
        <div id="ticket-feed" class="overflow-auto">
            <div class="text-center p-4 text-secondary small">Connecting to DB...</div>
        </div>
    </nav>

    <div id="workspace">
        <header class="top-nav">
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-success-subtle text-success rounded-pill px-3">Agent Online</span>
                <small class="text-muted">| MCP v1.0.4 Connected</small>
            </div>
            <div class="text-muted small">User Session: <strong>muvalika</strong></div>
        </header>

        <main id="chat-interface">
            <div id="message-flow">
                <div class="bubble bot shadow-sm">
                    Hi! I'm your IT assistant. I have direct access to the <strong>Employee Database</strong> and <strong>Ticket System</strong>. How can I help you today?
                </div>
            </div>

            <div class="action-bar">
                <button class="btn btn-outline-primary tile" onclick="Core.quick('I forgot my password')">🔑 Password Reset</button>
                <button class="btn btn-outline-primary tile" onclick="Core.quick('VPN is dropping connection')">🌐 VPN Diagnostic</button>
                <button class="btn btn-outline-primary tile" onclick="Core.quick('Check my open tickets')">🎫 View Tickets</button>
            </div>

            <div class="p-3 border-top bg-white">
                <div class="input-group shadow-sm rounded">
                    <input type="text" id="userInput" class="form-control border-0 bg-light px-3" placeholder="Describe your technical issue...">
                    <button class="btn btn-primary px-4" onclick="Core.send()">Send</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        /**
         * Core Engine: Orchestrates UI updates and Rasa/MCP API calls
         */
        const Core = (() => {
            const flow = document.getElementById('message-flow');
            const input = document.getElementById('userInput');
            const ENDPOINT = "http://localhost:5005/webhooks/rest/webhook";

            const addBubble = (text, type) => {
                const div = document.createElement('div');
                div.className = `bubble ${type} shadow-sm fade-in`;
                div.innerHTML = text;
                flow.appendChild(div);
                flow.scrollTop = flow.scrollHeight;
            };

            return {
                quick: (text) => { input.value = text; Core.send(); },
                send: async () => {
                    const msg = input.value.trim();
                    if(!msg) return;

                    addBubble(msg, 'user');
                    input.value = '';

                    try {
                        const response = await fetch(ENDPOINT, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ sender: "muvalika_portal", message: msg })
                        });
                        const data = await response.json();
                        data.forEach(res => {
                            if(res.text) addBubble(res.text, 'bot');
                        });
                    } catch (e) {
                        addBubble("<em>Error: Unable to reach the AI engine. Verify Rasa is running.</em>", 'bot');
                    }
                }
            };
        })();

        // Handle Enter Key
        document.getElementById('userInput').addEventListener('keypress', e => e.key === 'Enter' && Core.send());
    </script>
</body>
</html>
